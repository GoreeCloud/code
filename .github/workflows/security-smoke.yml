name: GoreeCloud Code security smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up security-patched Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Assert security-patched toolchain
        run: test "$(go version | awk '{print $3}')" = 'go1.26.9'
      - name: Verify charset, util and CSV utilities
        run: go test -p 2 -count=1 ./modules/charset ./modules/util ./modules/csv
      - name: Vet charset, util and CSV utilities
        run: go vet ./modules/charset ./modules/util ./modules/csv
      - name: Verify authentication and configuration packages
        run: go test -p 2 -count=1 ./modules/auth/... ./modules/setting/...
      - name: Vet authentication and configuration packages
        run: go vet ./modules/auth/... ./modules/setting/...
      - name: Verify downloaded module integrity
        run: go mod verify
