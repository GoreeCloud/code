name: GoreeCloud Code security smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up security-patched Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Assert security-patched toolchain
        run: test "$(go version | awk '{print $3}')" = 'go1.26.9'
      - name: Verify charset utilities
        run: go test -p 2 -count=1 ./modules/charset
      - name: Vet charset utilities
        run: go vet ./modules/charset
      - name: Verify downloaded module integrity
        run: go mod verify
