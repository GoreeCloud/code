name: GoreeCloud Code Context
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.9'
      - name: Validate read-only AI context envelope
        run: go test -count=1 ./modules/goreecloudcontext
