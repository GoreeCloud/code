name: GoreeCloud Code Context
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
      - name: Validate read-only AI context envelope
        run: go test -count=1 ./modules/goreecloudcontext
